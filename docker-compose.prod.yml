# 운영(EC2) 전용 오버라이드
#
# 사용법 — 두 파일을 함께 지정한다. 뒤에 오는 파일이 앞의 설정을 덮어쓴다.
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# 로컬 개발은 docker-compose.yml 단독으로 계속 사용한다(이 파일을 지정하지 않으면 영향 없음).
#
# 주의 — `!reset` / `!override` 태그는 Docker Compose v2.24.0 이상에서만 동작한다.
#        EC2에 설치 후 `docker compose version`으로 확인할 것.
#          !reset    → 상위 파일의 값을 지운다 (포트 노출 제거용)
#          !override → 리스트를 병합하지 않고 통째로 교체한다 (seed.sql 마운트 제외용)

services:
  db:
    # 호스트 포트 노출 제거 — 백엔드가 같은 도커 네트워크에서 `db:5432`로 접근한다.
    # 5432를 외부에 열면 보안 그룹과 무관하게 공격면이 늘어난다.
    ports: !reset []

    # 개발용 테스트 데이터(seed.sql) 마운트를 제외한다.
    # 리스트는 기본적으로 병합되므로 항목을 빼려면 !override로 전체를 교체해야 한다.
    volumes: !override
      - postgres-data:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql

    restart: unless-stopped

  backend:
    # 호스트 포트 노출 제거 — 외부 요청은 Nginx가 /api로 프록시한다.
    ports: !reset []
    restart: unless-stopped

  frontend:
    # 운영에서는 표준 HTTP 포트로 서비스한다.
    # (HTTPS 적용 시 443 매핑과 인증서 볼륨을 여기에 추가한다 — 배포 체크리스트 1-3)
    ports: !override
      - "80:80"
    restart: unless-stopped
