# 운영(EC2) 전용 오버라이드
#
# 사용법 — 두 파일을 함께 지정한다. 뒤에 오는 파일이 앞의 설정을 덮어쓴다.
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# 로컬 개발은 docker-compose.yml 단독으로 계속 사용한다(이 파일을 지정하지 않으면 영향 없음).
#
# 주의 — `!reset` / `!override` 태그는 Docker Compose v2.24.0 이상에서만 동작한다.
#        EC2에 설치 후 `docker compose version`으로 확인할 것.
#          !reset    → 상위 파일의 값을 지운다 (포트 노출 제거용)
#          !override → 리스트를 병합하지 않고 통째로 교체한다 (seed.sql 마운트 제외용)

# 컨테이너 로그 로테이션 설정 (세 서비스가 공유한다)
#
# Docker의 기본 json-file 드라이버는 로그 크기에 상한이 없어 무한정 쌓인다.
# 백엔드가 MyBatis SQL을 DEBUG로 남기고 봇 스캔 트래픽도 계속 들어오므로,
# 방치하면 디스크(20GB)를 잠식한다. 실측 기준 하루 100MB 수준이었다.
#
# 서비스당 10MB × 3개 파일 = 최대 30MB, 세 서비스 합쳐 90MB로 묶인다.
# `x-` 접두사 필드는 Compose가 서비스로 해석하지 않는 확장 영역이다.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    # 호스트 포트 노출 제거 — 백엔드가 같은 도커 네트워크에서 `db:5432`로 접근한다.
    # 5432를 외부에 열면 보안 그룹과 무관하게 공격면이 늘어난다.
    ports: !reset []

    logging: *default-logging

    # 개발용 테스트 데이터(seed.sql) 마운트를 제외하고 운영용 demo.sql로 교체한다.
    # 리스트는 기본적으로 병합되므로 항목을 빼려면 !override로 전체를 교체해야 한다.
    #
    # 주의 — /docker-entrypoint-initdb.d/ 의 스크립트는 **데이터 볼륨이 비어 있을 때만**
    #        실행된다. 이미 운영 중인 DB에는 자동 반영되지 않으므로, 기존 볼륨에 데모
    #        데이터를 넣으려면 scripts/reset-demo.sh를 수동으로 한 번 실행해야 한다.
    volumes: !override
      - postgres-data:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      # 데모 데이터 — 초기 구동 시 자동 적재된다.
      # 이후 초기화는 scripts/reset-demo.sh가 이 경로의 파일을 psql로 재실행한다.
      - ./sql/demo.sql:/docker-entrypoint-initdb.d/02_demo.sql

    restart: unless-stopped

  backend:
    # 호스트 포트 노출 제거 — 외부 요청은 Nginx가 /api로 프록시한다.
    ports: !reset []
    restart: unless-stopped
    logging: *default-logging

  frontend:
    # 운영에서는 표준 HTTP(80) + HTTPS(443) 포트로 서비스한다.
    ports: !override
      - "80:80"
      - "443:443"

    volumes:
      # 운영 전용 Nginx 설정으로 이미지 안의 default.conf를 덮어쓴다.
      # 443 블록은 인증서가 있어야 nginx가 기동하므로 로컬용(nginx.conf)과 파일을 분리했다.
      # 볼륨 마운트라 설정만 바꿀 때는 이미지 재빌드 없이 컨테이너 재생성으로 반영된다.
      - ./frontend/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro

      # Let's Encrypt 인증서 (호스트에서 certbot으로 발급) — 읽기 전용
      - /etc/letsencrypt:/etc/letsencrypt:ro

      # webroot 방식으로 갱신 전환할 경우의 챌린지 경로 (standalone 사용 중에는 비어 있다)
      - /var/www/certbot:/var/www/certbot:ro

    restart: unless-stopped
    logging: *default-logging
