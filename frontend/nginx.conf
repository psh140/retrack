server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # React Router SPA 폴백 — 새로고침 시 404 방지
    location / {
        try_files $uri /index.html;
    }

    # Docker 내장 DNS — backend 컨테이너 IP를 요청 시마다 재조회한다.
    # valid=10s: 조회 결과를 10초만 캐싱 (컨테이너 재생성 시 최대 10초 내 복구)
    # ipv6=off:  Docker 내장 DNS는 AAAA 미응답 — 불필요한 조회 제거
    resolver 127.0.0.11 valid=10s ipv6=off;

    # /api 요청 → backend 컨테이너(8080) 리버스 프록시
    location /api {
        # 업스트림 호스트를 변수로 지정해야 nginx가 기동 시점 IP를 고정하지 않는다.
        # (상수로 쓰면 backend 컨테이너 재생성 후 옛 IP를 계속 참조해 502 발생)
        set $backend_host backend;

        # 변수 사용 시 요청 URI가 자동 전달되지 않으므로 $request_uri를 명시한다.
        proxy_pass http://$backend_host:8080$request_uri;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
