server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 업로드 파일 최대 크기 — spring-mvc.xml의 maxUploadSize(10MB)와 반드시 일치시킨다.
    # 미설정 시 nginx 기본값 1MB로 잘려 백엔드의 MaxUploadSizeExceededException 핸들러가
    # 실행되지 못하고 nginx 기본 413 HTML이 사용자에게 노출된다.
    client_max_body_size 10m;

    # 텍스트 자산 gzip 압축 — 이미 압축된 포맷(이미지·폰트 woff2)은 제외한다
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    # 보안 헤더
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # React Router SPA 폴백 — 새로고침 시 404 방지
    location / {
        try_files $uri /index.html;
    }

    # 정적 자산 장기 캐시 — Vite가 빌드 시 파일명에 해시를 붙이므로
    # 내용이 바뀌면 파일명이 바뀐다. 따라서 immutable 캐시가 안전하다.
    # index.html은 이 패턴에 걸리지 않으므로 항상 새로 받아 간다.
    #
    # 정규식 location은 prefix location(`/`)보다 우선하지만, 여기 걸리는 것은
    # 확장자가 붙은 요청뿐이다. /dashboard 같은 라우트는 그대로 SPA 폴백을 탄다.
    location ~* \.(js|css|svg|woff2?|ico|png|jpg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";

        # nginx의 add_header는 하위 블록에 add_header가 하나라도 있으면
        # 상위 블록의 것을 상속하지 않는다. 그래서 여기서 다시 선언한다.
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # Docker 내장 DNS — backend 컨테이너 IP를 요청 시마다 재조회한다.
    # valid=10s: 조회 결과를 10초만 캐싱 (컨테이너 재생성 시 최대 10초 내 복구)
    # ipv6=off:  Docker 내장 DNS는 AAAA 미응답 — 불필요한 조회 제거
    resolver 127.0.0.11 valid=10s ipv6=off;

    # /api 요청 → backend 컨테이너(8080) 리버스 프록시
    location /api {
        # 업스트림 호스트를 변수로 지정해야 nginx가 기동 시점 IP를 고정하지 않는다.
        # (상수로 쓰면 backend 컨테이너 재생성 후 옛 IP를 계속 참조해 502 발생)
        set $backend_host backend;

        # 변수 사용 시 요청 URI가 자동 전달되지 않으므로 $request_uri를 명시한다.
        proxy_pass http://$backend_host:8080$request_uri;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
