# 운영(EC2) 전용 Nginx 설정 — HTTPS 적용본
#
# 로컬 개발은 nginx.conf(80 포트 전용)를 그대로 쓴다.
# 이 파일은 docker-compose.prod.yml에서 볼륨으로 마운트해 이미지 안의 설정을 덮어쓴다.
#   ./frontend/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
#
# 별도 파일로 분리한 이유:
#   443 블록은 인증서 파일이 있어야 nginx가 기동한다. 로컬에는 인증서가 없으므로
#   한 파일에 합치면 개발 환경에서 프론트엔드 컨테이너가 뜨지 않는다.
#
# 인증서는 호스트의 /etc/letsencrypt를 컨테이너에 읽기 전용으로 마운트해 참조한다.

# HTTP — 모든 요청을 HTTPS로 넘긴다
server {
    listen 80;
    server_name hughpark.com www.hughpark.com;

    # certbot 갱신 시 HTTP-01 챌린지 경로는 리다이렉트하지 않고 그대로 응답해야 한다.
    # (standalone 방식에서는 쓰이지 않지만, webroot 방식으로 바꿀 때를 대비해 남겨둔다)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — 실제 서비스
server {
    listen 443 ssl;
    http2 on;
    server_name hughpark.com www.hughpark.com;

    ssl_certificate     /etc/letsencrypt/live/hughpark.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hughpark.com/privkey.pem;

    # Let's Encrypt 권장값 (certbot이 생성하는 options-ssl-nginx.conf와 동일한 수준)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /usr/share/nginx/html;
    index index.html;

    # React Router SPA 폴백 — 새로고침 시 404 방지
    location / {
        try_files $uri /index.html;
    }

    # Docker 내장 DNS — backend 컨테이너 IP를 요청 시마다 재조회한다.
    # valid=10s: 조회 결과를 10초만 캐싱 (컨테이너 재생성 시 최대 10초 내 복구)
    # ipv6=off:  Docker 내장 DNS는 AAAA 미응답 — 불필요한 조회 제거
    resolver 127.0.0.11 valid=10s ipv6=off;

    # /api 요청 → backend 컨테이너(8080) 리버스 프록시
    location /api {
        # 업스트림 호스트를 변수로 지정해야 nginx가 기동 시점 IP를 고정하지 않는다.
        # (상수로 쓰면 backend 컨테이너 재생성 후 옛 IP를 계속 참조해 502 발생)
        set $backend_host backend;

        # 변수 사용 시 요청 URI가 자동 전달되지 않으므로 $request_uri를 명시한다.
        proxy_pass http://$backend_host:8080$request_uri;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # HTTPS 종단이 Nginx이므로 백엔드가 원 요청 프로토콜을 알 수 있도록 전달한다.
        proxy_set_header X-Forwarded-Proto $scheme;

        # Origin 헤더 제거 — HTTPS 전환 후 로그인/회원가입이 403으로 막히던 문제의 해결책.
        #
        # 브라우저는 `Origin: https://hughpark.com`을 보내지만 Nginx는 백엔드로 HTTP로 프록시하므로
        # 백엔드가 보는 요청 scheme은 http다. Spring은 Origin과 요청 URL의 scheme이 다르면
        # cross-origin으로 판단하는데, spring-mvc.xml의 allowed-origins에는 개발용
        # http://localhost:3000만 있어 403이 반환됐다. (HTTP로 서비스할 때는 양쪽이 http라
        # same-origin으로 판정되어 CORS 검사를 건너뛰었기 때문에 문제가 드러나지 않았다.)
        #
        # Nginx 뒤는 항상 동일 출처이므로 Origin을 전달할 이유가 없다. 헤더를 비우면
        # Spring이 CORS 검사를 수행하지 않는다. 브라우저 관점에서도 same-origin 요청이라
        # preflight(OPTIONS)가 발생하지 않으므로 이 방식으로 충분하다.
        proxy_set_header Origin "";
    }
}
